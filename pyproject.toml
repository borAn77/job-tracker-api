[project]
name = "job-tracker-api"
version = "0.1.0"
description = "FastAPI backend for tracking job applications, with LLM-based job description parsing"
readme = "README.md"
authors = [
    { name = "borAn77", email = "borangedik123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
